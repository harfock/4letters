name: Build and deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: idiom-game-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl pillow cairosvg
      - name: Syntax-check generator and prepare site
        run: |
          python -m py_compile tools/build_levels.py tools/build_stroke_counts.py
          mkdir -p public/data
          cp index.html public/index.html
          cp app-icon.svg public/app-icon.svg
          cp manifest.webmanifest public/manifest.webmanifest
          python - <<'PY'
          import cairosvg
          for size,name in [(180,'apple-touch-icon.png'),(192,'icon-192.png'),(512,'icon-512.png')]:
              cairosvg.svg2png(url='app-icon.svg',write_to='public/'+name,output_width=size,output_height=size)
          PY
          python - <<'PY'
          import re
          html=open('index.html',encoding='utf-8').read()
          match=re.search(r'<script>([\s\S]*?)</script>',html)
          if not match: raise SystemExit('No inline JavaScript found')
          open('/tmp/game.js','w',encoding='utf-8').write(match.group(1))
          PY
          node --check /tmp/game.js
      - name: Download official MOE idiom data
        run: curl -L --fail --retry 3 -o /tmp/source.zip https://language.moe.gov.tw/001/Upload/Files/site_content/M0001/respub/download/dict_idioms_2020_20260929.zip
      - name: Extract workbook
        run: |
          python - <<'PY'
          import zipfile
          z=zipfile.ZipFile('/tmp/source.zip')
          files=[n for n in z.namelist() if n.lower().endswith('.xlsx')]
          if not files: raise SystemExit('Official ZIP contains no XLSX workbook')
          with open('/tmp/source.xlsx','wb') as f: f.write(z.read(files[0]))
          PY
      - name: Generate and validate static levels
        run: python tools/build_levels.py /tmp/source.xlsx public/data/levels.json
      - name: Download stroke-count reference data
        run: |
          mkdir -p /tmp/stroke-data
          curl -L --fail --retry 3 -o /tmp/stroke-data/1.4e00-9fff.txt https://raw.githubusercontent.com/caiguanhao/ChineseStrokes/master/data/1.4e00-9fff.txt
          curl -L --fail --retry 3 -o /tmp/stroke-data/2.3400-4dbf.txt https://raw.githubusercontent.com/caiguanhao/ChineseStrokes/master/data/2.3400-4dbf.txt
      - name: Generate stroke-count map for game characters
        run: python tools/build_stroke_counts.py public/data/levels.json /tmp/stroke-data public/data/strokes.json
      - name: Keep generated levels available to all Pages sources
        run: |
          mkdir -p data
          cp public/data/levels.json data/levels.json
          cp public/data/strokes.json data/strokes.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/levels.json data/strokes.json
          if ! git diff --cached --quiet; then
            git commit -m "Update generated crossword level data"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4

/* Refined jade / ocean / ivory theme and compact two-row information */
:root{--bg:#071e2b;--p:#123b49;--line:#367f8c;--ink:#f5fbf7;--mint:#8ce7c7;--gold:#ffd166;--accent:#74dce6;--cell:40px}

main{padding-top:4px}

/* Level picker folds away until requested */
.layout{width:900px;min-width:900px;max-width:none;grid-template-columns:minmax(0,1fr);gap:12px;margin:0 auto;align-items:start}
.layout.levels-open{grid-template-columns:minmax(0,1fr) 260px}
.level-panel[hidden],.next-float[hidden]{display:none!important}
.level-panel{min-width:0;animation:panel-in .16s ease-out}
@keyframes panel-in{from{opacity:.2;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.board-row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:center;min-width:0}
.board-row.has-next{grid-template-columns:112px minmax(0,1fr)}
.next-float{position:relative;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:9px;min-width:0;padding:12px 9px;border:1px solid rgba(255,209,102,.8);border-radius:16px;background:linear-gradient(155deg,#275869,#143d4e 78%);box-shadow:0 8px 22px rgba(0,10,25,.28),inset 0 1px 0 rgba(255,255,255,.08);text-align:center;animation:next-pop .2s ease-out}
.next-float:before{content:"";position:absolute;inset:-3px;border:1px solid rgba(255,209,102,.18);border-radius:18px;pointer-events:none}
.next-float strong{font-size:13px;line-height:1.35;color:#ffdf8c}
.next-float small{font-size:10px;line-height:1.45;color:#d3efea;overflow-wrap:anywhere}
.next-float button{white-space:normal;padding:10px 7px;line-height:1.2;box-shadow:0 3px 0 rgba(0,25,30,.3)}
/* Keep a visible next-level message outlined by a continuous flashing gold border. */
.next-float:not([hidden]){animation:next-pop .2s ease-out,finish-border-shine 1.15s ease-in-out .2s infinite}
.next-float:not([hidden]):before{animation:finish-glow-shine 1.15s ease-in-out .2s infinite}
.next-float.finish-shine{animation:next-pop .2s ease-out,finish-border-shine 1.15s ease-in-out .2s infinite}
.next-float.finish-shine:before{animation:finish-glow-shine 1.15s ease-in-out .2s infinite}
@keyframes finish-border-shine{
 0%{border-color:#fff7cc;box-shadow:0 0 0 0 rgba(255,226,132,0),0 8px 22px rgba(0,10,25,.28),inset 0 1px 0 rgba(255,255,255,.08)}
 24%{border-color:#fffbe5;box-shadow:0 0 0 3px rgba(255,226,132,.52),0 0 26px 8px rgba(255,215,103,.5),0 8px 22px rgba(0,10,25,.28)}
 58%{border-color:#ffe39a;box-shadow:0 0 0 1px rgba(255,226,132,.3),0 0 12px 2px rgba(255,215,103,.24),0 8px 22px rgba(0,10,25,.28)}
 100%{border-color:rgba(255,209,102,.8);box-shadow:0 8px 22px rgba(0,10,25,.28),inset 0 1px 0 rgba(255,255,255,.08)}
}
@keyframes finish-glow-shine{
 0%,100%{border-color:rgba(255,209,102,.18);opacity:.55}
 28%{border-color:#fff6c5;opacity:1;box-shadow:0 0 18px 5px rgba(255,222,128,.42)}
 60%{border-color:rgba(255,220,128,.45);opacity:.75}
}
.level-time-popup[hidden]{display:none!important}
.level-time-popup{position:fixed;left:50%;top:50%;z-index:100000;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:min(270px,82vw);padding:20px 28px;border:1px solid rgba(255,235,171,.98);border-radius:20px;background:linear-gradient(145deg,rgba(25,83,76,.97),rgba(8,44,48,.97));color:#fff8df;box-shadow:0 0 0 1px rgba(255,224,140,.28),0 0 32px 8px rgba(255,214,104,.28),0 18px 60px rgba(0,0,0,.5);text-align:center;pointer-events:none;animation:level-time-pop .24s ease-out}
.level-time-popup span{font-size:14px;font-weight:750;letter-spacing:.04em;color:#ffe8a6}
.level-time-popup strong{font-size:clamp(32px,8vw,48px);line-height:1.05;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(255,225,141,.4)}
@keyframes level-time-pop{from{opacity:0;transform:translate(-50%,-50%) scale(.86)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@media(prefers-reduced-motion:reduce){.next-float:not([hidden]),.next-float:not([hidden]):before,.next-float.finish-shine,.next-float.finish-shine:before,.level-time-popup{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@keyframes next-pop{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

<script>
(()=>{'use strict';
const $=x=>document.getElementById(x),KEY='idiom-crossword-progress-v3';
/* Suppress browser context menus/callouts and native drag images; custom tile dragging remains enabled. */
document.addEventListener('contextmenu',e=>{e.preventDefault();return false;});
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('selectstart',e=>{if(!e.target.closest('input,textarea'))e.preventDefault();});

   Only a gesture that starts on a candidate tile is arbitrated by the tile's
   pointer handler below: short movement scrolls; a stationary hold starts a drag. */

let D,S,STROKES={},L=0,W=0,sel='',advanceTimer=null,activeDrag=null,pendingBoardFocus=null;
let lastTouchCellTap=null,lastTouchDoubleTap=null,suppressTouchCellClick=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const fresh=()=>({levels:{},total:0});
function state(){
 const key=L+1;
 if(!S.levels[key]){
  const s=S.levels[key]={letters:{},revealed:{},completed:{},seconds:0,finished:false};
  if(D&&D.levels[L])D.levels[L].placements.forEach(p=>{
   if(p.initialReveal)cells(p).slice(0,p.initialReveal).forEach(c=>{s.revealed[c.r+','+c.c]=c.ch});
  });
 }
 return S.levels[key];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cells(p){return [...p.word].map((ch,i)=>({r:p.row+(p.direction==='down'?i:0),c:p.col+(p.direction==='across'?i:0),ch}))}
function grid(){
 const ps=D.levels[L].placements,m=new Map();let minr=1e9,minc=1e9,maxr=-1e9,maxc=-1e9;
 ps.forEach((p,i)=>cells(p).forEach(x=>{
  minr=Math.min(minr,x.r);minc=Math.min(minc,x.c);maxr=Math.max(maxr,x.r);maxc=Math.max(maxc,x.c);
  const k=x.r+','+x.c;
  if(!m.has(k))m.set(k,{r:x.r,c:x.c,ch:x.ch,ids:[]});
  m.get(k).ids.push(i);
 }));
 return{ps,m,minr,minc,maxr,maxc};
}
function boardCellSize(available,gap){
 const first=D.levels[0].placements;
 let minc=Infinity,maxc=-Infinity;
 first.forEach(p=>cells(p).forEach(x=>{minc=Math.min(minc,x.c);maxc=Math.max(maxc,x.c)}));
 const firstCols=maxc-minc+1;
 return Math.max(7,Math.min(40,(available-gap*(firstCols-1))/firstCols));
}
function focusBoardCell(key){
 if(!key)return;
 const wrap=$('boardWrap'),cell=document.querySelector('.cell[data-key="'+key+'"]');
 if(!wrap||!cell)return;
 const wr=wrap.getBoundingClientRect(),cr=cell.getBoundingClientRect();
 const topDelta=cr.top-wr.top, bottomDelta=cr.bottom-wr.bottom;
 if(topDelta<0)wrap.scrollTop+=topDelta-(wrap.clientHeight-cr.height)/2;
 else if(bottomDelta>0)wrap.scrollTop+=bottomDelta+(cr.height-wrap.clientHeight)/2;
 const leftDelta=cr.left-wr.left,rightDelta=cr.right-wr.right;
 if(leftDelta<0)wrap.scrollLeft+=leftDelta-(wrap.clientWidth-cr.width)/2;
 else if(rightDelta>0)wrap.scrollLeft+=rightDelta+(cr.width-wrap.clientWidth)/2;
 updateBoardControls();
}
function applyPendingBoardFocus(){
 if(!pendingBoardFocus)return;
 const key=pendingBoardFocus;pendingBoardFocus=null;
 requestAnimationFrame(()=>focusBoardCell(key));
}
function updateBoardControls(){
 const wrap=$('boardWrap');if(!wrap)return;
 const canLeft=wrap.scrollLeft>2,canRight=wrap.scrollLeft+wrap.clientWidth<wrap.scrollWidth-2;
 const canUp=wrap.scrollTop>2,canDown=wrap.scrollTop+wrap.clientHeight<wrap.scrollHeight-2;
 $('navLeft').hidden=!canLeft;$('navRight').hidden=!canRight;
 $('navUp').hidden=!canUp;$('navDown').hidden=!canDown;
 const s=state(),zoom=Math.round((Number(s.zoom)||1)*100);
 $('zoomLabel').textContent=zoom+'%';
}
function setZoom(delta){
 const s=state(),current=Number(s.zoom)||1;
 s.zoom=Math.max(.65,Math.min(2.5,Math.round((current+delta)*100)/100));
 save();render();
}
function ensureTiles(s,g){
 if(!s.tileAssignment)s.tileAssignment={};
 if(!Array.isArray(s.exhaustedTiles))s.exhaustedTiles=[];
 if(!Array.isArray(s.tiles)){
  s.tiles=[];let n=0;
  for(const z of g.m.values()){
   const k=z.r+','+z.c;
   if(!s.revealed[k])s.tiles.push({id:'tile-'+n++,char:z.ch});
  }
  for(let i=s.tiles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s.tiles[i],s.tiles[j]]=[s.tiles[j],s.tiles[i]]}
 }
}
function val(x){const k=x.r+','+x.c,s=state();return s.letters[k]||s.revealed[k]||''}
function assignedIds(s){return new Set(Object.values(s.tileAssignment||{}))}
function exhaustedIds(s){return new Set(s.exhaustedTiles||[])}
function availableTiles(s){const used=assignedIds(s),spent=exhaustedIds(s);return s.tiles.filter(t=>!used.has(t.id)&&!spent.has(t.id))}

}
function returnFilledLetter(k){
 const current=state(),g=grid(),z=g.m.get(k);
 if(current.revealed[k]){say('提示字不能移除。');return false}
 if(!current.tileAssignment||!current.tileAssignment[k]||!current.letters[k]){
  say('這格沒有可退回的候選字。');return false;
 }
 const oldChar=current.letters[k];
 delete current.tileAssignment[k];delete current.letters[k];
 if(z)z.ids.forEach(id=>{delete current.completed[id]});

function render(){
 const g=grid(),s=state(),b=$('board'),wrap=$('boardWrap');ensureTiles(s,g);
 const oldScrollTop=wrap.scrollTop,oldScrollLeft=wrap.scrollLeft;
 b.innerHTML='';
 const colCount=g.maxc-g.minc+1;
 const available=Math.max(80,wrap.clientWidth-12);
 const gap=colCount>18?1:2;
 const baseCellSize=boardCellSize(available,gap);
 const cellSize=Math.max(7,Math.min(100,baseCellSize*(Number(s.zoom)||1)));
 b.style.setProperty('--cell',cellSize+'px');
 b.style.setProperty('--cell-font',Math.max(6,Math.min(20,cellSize*.62))+'px');
 b.style.gap=gap+'px';
 b.style.gridTemplateColumns='repeat('+colCount+','+cellSize+'px)';
 const starts=new Map();g.ps.forEach((p,i)=>starts.set(p.row+','+p.col,i+1));
 for(let r=g.minr;r<=g.maxr;r++)for(let c=g.minc;c<=g.maxc;c++){
  const z=g.m.get(r+','+c),el=document.createElement('button');el.type='button';el.className='cell'+(z?'':' block');el.style.gridRow=r-g.minr+1;el.style.gridColumn=c-g.minc+1;
  if(z){
   const k=r+','+c,letter=s.letters[k]||s.revealed[k]||'';el.dataset.key=k;el.textContent=letter;
   if(s.letters[k])el.classList.add('filled');

   });

     lastTouchCellTap=null;return;

   };

    ev.preventDefault();ev.stopPropagation();

  });

function renderCandidates(s){
 const box=$('candidates');box.innerHTML='';
 const free=availableTiles(s).slice().sort((a,b)=>{
  const ac=STROKES[a.char]||999,bc=STROKES[b.char]||999;
  return ac-bc||a.char.codePointAt(0)-b.char.codePointAt(0)||a.id.localeCompare(b.id);
 });
 $('candidateCount').textContent='剩餘 '+free.length+' 字 · 按筆畫由少至多';
 if(!free.length){const empty=document.createElement('div');empty.className='candidate-empty';empty.textContent='目前沒有剩餘候選字。若放錯，可清除格子後再試。';box.append(empty);return}
 free.forEach(tile=>{
  const el=document.createElement('button');el.type='button';el.className='candidate-tile';
  const ch=document.createElement('span');ch.className='candidate-character';ch.textContent=tile.char;el.append(ch);
  const stroke=document.createElement('span');stroke.className='stroke-count';stroke.textContent=STROKES[tile.char]||'?';el.append(stroke);
  el.title=tile.char+' · '+(STROKES[tile.char]||'未知')+' 畫';
  el.setAttribute('aria-label','拖曳候選字 '+tile.char+'，'+(STROKES[tile.char]||'未知')+' 畫，到棋盤格');el.dataset.tileId=tile.id;
  el.addEventListener('pointerdown',e=>beginDrag(e,tile));box.append(el);
 });
}
function setLevelPanelOpen(open){
 const panel=$('levelPanel'),layout=$('layout');
 panel.hidden=!open;
 layout.classList.toggle('levels-open',open);
 $('chooseLevelBtn').textContent=open?'收起關卡':'選擇關卡';
 // Keep the document's scroll position stable when opening the in-page level picker.
}
function switchLevel(i){
 cancelActiveDrag();close();setLevelPanelOpen(false);
 L=Math.max(0,Math.min(20,i));W=0;sel='';
 const s=state(),g=grid();
 const clue=Object.keys(s.revealed||{})[0];
 pendingBoardFocus=clue||(()=>{const p=g.ps.find((x,j)=>!s.completed[j]);if(!p)return null;const x=cells(p)[0];return x.r+','+x.c})();
 render();
}
function say(t){$('toast').textContent=t}
function beginDrag(e,tile){
 if(e.pointerType==='mouse'&&e.button!==0)return;
 const s=state(),g=grid();ensureTiles(s,g);
 if(!availableTiles(s).some(t=>t.id===tile.id))return;
 // Touching an actual letter means "drag this letter" immediately.
 // Swipes on the empty candidate-panel space use native browser scrolling.
 startTileDrag(e,tile);
}
function startTileDrag(e,tile){
 if(e.pointerType==='mouse'&&e.button!==0)return;
 const s=state(),g=grid();ensureTiles(s,g);
 if(!availableTiles(s).some(t=>t.id===tile.id))return;
 e.preventDefault();cancelActiveDrag(false);
 const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=tile.char;ghost.setAttribute('aria-hidden','true');document.body.append(ghost);
 activeDrag={tile,tileId:tile.id,pointerId:e.pointerId,ghost,targetKey:null,
  startX:e.clientX,startY:e.clientY,moved:false};
 ghost.style.left=e.clientX+'px';
 ghost.style.top=Math.max(42,e.clientY-72)+'px';
 document.addEventListener('pointermove',moveDrag,{passive:false});
 document.addEventListener('pointerup',endDrag);
 document.addEventListener('pointercancel',cancelActiveDrag);
}
function dragVisualPoint(e){
 // The floating tile uses translate(-50%,-50%), so its CSS top is its visual centre.
 // Hit-test that centre, not the user's finger point, which sits lower on touch screens.
 return {x:e.clientX,y:Math.max(42,e.clientY-72)};
}
function resolveDropTarget(tile,e){
 const point=dragVisualPoint(e),g=grid();
 const options=[...document.querySelectorAll('.cell[data-key]')].filter(el=>canDrop(el.dataset.key)).map(el=>{
  const rect=el.getBoundingClientRect();
  const dx=rect.left+rect.width/2-point.x,dy=rect.top+rect.height/2-point.y;
  return {el,key:el.dataset.key,distance:Math.hypot(dx,dy),width:rect.width,correct:g.m.get(el.dataset.key)?.ch===tile.char};
 });
 // Smart snap: if the released character matches a nearby empty answer cell,
 // prefer that cell even when the pointer is a little off-centre.
 const correct=options.filter(o=>o.correct).sort((a,b)=>a.distance-b.distance)[0];
 if(correct&&correct.distance<=Math.max(74,correct.width*2.1))return correct.key;
 // Otherwise use the cell beneath the enlarged character, then the finger.
 for(const p of [point,{x:e.clientX,y:e.clientY}]){
  const hit=document.elementFromPoint(p.x,p.y);
  const target=hit&&hit.closest?hit.closest('.cell[data-key]'):null;
  if(target&&canDrop(target.dataset.key))return target.dataset.key;
 }
 // Last-resort near-cell tolerance helps with slightly imprecise releases.
 const nearest=options.sort((a,b)=>a.distance-b.distance)[0];
 return nearest&&nearest.distance<=Math.max(44,nearest.width*1.15)?nearest.key:null;
}
function moveDrag(e){
 if(!activeDrag||e.pointerId!==activeDrag.pointerId)return;
 const distance=Math.hypot(e.clientX-activeDrag.startX,e.clientY-activeDrag.startY);
 if(!activeDrag.moved&&distance<7)return;
 activeDrag.moved=true;
 e.preventDefault();
 activeDrag.ghost.style.left=e.clientX+'px';
 activeDrag.ghost.style.top=Math.max(42,e.clientY-72)+'px';
 document.querySelectorAll('.cell.drop-target').forEach(el=>el.classList.remove('drop-target'));
 activeDrag.targetKey=resolveDropTarget(activeDrag.tile,e);
 if(activeDrag.targetKey){
  const target=document.querySelector('.cell[data-key="'+activeDrag.targetKey+'"]');
  if(target)target.classList.add('drop-target');
 }
}
function cleanupDrag(){
 document.removeEventListener('pointermove',moveDrag);
 document.removeEventListener('pointerup',endDrag);
 document.removeEventListener('pointercancel',cancelActiveDrag);
 document.querySelectorAll('.cell.drop-target').forEach(el=>el.classList.remove('drop-target'));
 if(activeDrag&&activeDrag.ghost)activeDrag.ghost.remove();
 activeDrag=null;
}
function cancelActiveDrag(showMessage=true){
 const wasDragging=!!activeDrag;cleanupDrag();
 if(showMessage&&wasDragging)say('已取消拖曳。');
}
function endDrag(e){
 if(!activeDrag||e.pointerId!==activeDrag.pointerId)return;
 moveDrag(e);
 const tile=activeDrag.tile,k=activeDrag.targetKey,moved=activeDrag.moved;
 cleanupDrag();
 if(k&&moved)dropTile(tile,k);
}
function dropTile(tile,k){
 const s=state(),g=grid();ensureTiles(s,g);
 if(!canDrop(k)){say('請把候選字放到未完成成語的空格。');return}
 if(!availableTiles(s).some(t=>t.id===tile.id)){say('這個候選字已被使用。');return}
 const previous=s.tileAssignment[k];
 if(previous){delete s.tileAssignment[k];delete s.letters[k]}
 s.tileAssignment[k]=tile.id;s.letters[k]=tile.char;sel=k;
 if(tile.char===g.m.get(k).ch)say('已放入「'+tile.char+'」。');
 else say('已放入「'+tile.char+'」；若不合適，可選格後按「清除選格」。');
 checkAll();render();
}
function releaseTileAt(s,k){if(s.tileAssignment[k])delete s.tileAssignment[k];delete s.letters[k]}
function revealCell(s,g,k,ch){
 if(s.revealed[k])return;
 const current=s.letters[k];
 const oldTileId=s.tileAssignment[k];
 const oldTile=oldTileId?s.tiles.find(t=>t.id===oldTileId):null;
 if(oldTileId){delete s.tileAssignment[k];delete s.letters[k]}
 if(current===ch){
  if(oldTile&&oldTile.char===ch&&!s.exhaustedTiles.includes(oldTile.id))s.exhaustedTiles.push(oldTile.id);
  s.revealed[k]=ch;
  return;
 }
 delete s.letters[k];
 const used=assignedIds(s),spent=exhaustedIds(s);
 let clueTile=oldTile&&oldTile.char===ch?oldTile:s.tiles.find(t=>t.char===ch&&!used.has(t.id)&&!spent.has(t.id));
 if(!clueTile){
  for(const [otherKey,tileId] of Object.entries(s.tileAssignment)){
   const tile=s.tiles.find(t=>t.id===tileId),z=g.m.get(otherKey);
   if(tile&&tile.char===ch&&z&&z.ch!==ch&&!isLocked(z,s)){
    delete s.tileAssignment[otherKey];delete s.letters[otherKey];clueTile=tile;break;
   }
  }
 }
 if(clueTile&&!s.exhaustedTiles.includes(clueTile.id))s.exhaustedTiles.push(clueTile.id);
 s.revealed[k]=ch;
}
function checkAll(){
 const s=state(),g=grid();
 g.ps.forEach((p,i)=>{
  if(s.completed[i])return;
  const cs=cells(p);
  if(cs.map(val).join('')===p.word){
   s.completed[i]=true;
   cs.forEach((x,j)=>{s.letters[x.r+','+x.c]=p.word[j]});
   cs.forEach(x=>{
    const z=g.m.get(x.r+','+x.c);
    z.ids.forEach(j=>{
     if(j!==i&&!s.completed[j]&&!g.ps[j].initialReveal){
      const clue=cells(g.ps[j])[0],k=clue.r+','+clue.c;
      revealCell(s,g,k,clue.ch);
     }
    });
   });
   say('答對：'+p.word+'！已解鎖相交成語的提示字。');
  }
 });
 if(Object.values(s.completed).filter(Boolean).length===g.ps.length&&!s.finished){s.finished=true;complete()}
}
function hint(){
 const s=state(),g=grid();ensureTiles(s,g);
 const count=g.ps.length;
 let chosen=-1,target=null;
 // Start at the focused idiom, skip completed idioms, and wrap around to the
 // next unfinished set when the current one already has no hintable cells.
 for(let step=0;step<count;step++){
  const index=(W+step)%count;
  if(s.completed[index])continue;
  const wordCells=cells(g.ps[index]);
  target=wordCells.find(c=>!s.revealed[c.r+','+c.c]&&val(c)!==c.ch)
       ||wordCells.find(c=>!s.revealed[c.r+','+c.c]);
  if(target){chosen=index;break}
 }
 if(chosen<0){say('本關所有成語都已完成，沒有更多提示。');return}
 W=chosen;
 const k=target.r+','+target.c;
 pendingBoardFocus=k;
 revealCell(s,g,k,target.ch);
 sel=k;
 say('提示：第 '+(chosen+1)+' 組「'+g.ps[chosen].word+'」已揭示「'+target.ch+'」。');
 checkAll();render();
}
function checkOne(){const p=grid().ps[W];if(cells(p).map(val).join('')===p.word){checkAll();say(state().completed[W]?'正確！':'字詞已符合，請再檢查交叉格。')}else say('本詞尚未正確，請調整候選字。');render()}
function clearSelected(){
 if(!sel){say('請先點選一個格子。');return}
 const s=state(),g=grid(),z=g.m.get(sel);
 if(!z){say('這不是可填寫的格子。');return}
 if(s.revealed[sel]){say('提示字不能清除。');return}
 if(isLocked(z,s)){say('已完成成語的字不能清除。');return}
 releaseTileAt(s,sel);say('已清除該格，候選字已放回清單。');render();
}
let levelTimePopupTimer=null;
function showLevelTimePopup(){
 const popup=$('levelTimePopup');
 $('levelTimePopupTitle').textContent=L===20?'全部 21 關完成！':'第 '+(L+1)+' 關完成';
 $('levelTimePopupValue').textContent=fmt(state().seconds);
 popup.hidden=false;
 if(levelTimePopupTimer)clearTimeout(levelTimePopupTimer);
 levelTimePopupTimer=setTimeout(()=>{popup.hidden=true;levelTimePopupTimer=null},2000);
 const box=$('nextFloat');
 box.classList.remove('finish-shine');
 void box.offsetWidth;
 box.classList.add('finish-shine');
}
function complete(){
 showLevelTimePopup();
 const finishedCount=Object.values(S.levels).reduce((n,x)=>n+Object.values(x.completed||{}).filter(Boolean).length,0);
 if(L===20)say('恭喜完成全部 21 關！總用時 '+fmt(S.total)+'，完成 '+finishedCount+'/420。按左側「下一關」可重新開始。');
 else say('第 '+(L+1)+' 關完成！本關用時 '+fmt(state().seconds)+'。按棋盤左側「下一關」繼續。');
}
function close(){if(advanceTimer)clearInterval(advanceTimer);advanceTimer=null;$('modalback').classList.remove('show')}
function goNext(){close();switchLevel(L===20?0:L+1)}
$('chooseLevelBtn').onclick=()=>setLevelPanelOpen($('levelPanel').hidden);
$('nextLevelBtn').onclick=()=>{
 const last=L===20;
 switchLevel(last?0:L+1);
 if(last)say('已重新開始第 1 關。');
};
$('hint').onclick=hint;$('hintFloat').onclick=hint;$('check').onclick=checkOne;
$('zoomOut').onclick=()=>setZoom(-.15);$('zoomIn').onclick=()=>setZoom(.15);
$('navLeft').onclick=()=>{$('boardWrap').scrollBy({left:-Math.max(100,$('boardWrap').clientWidth*.72),behavior:'smooth'})};
$('navRight').onclick=()=>{$('boardWrap').scrollBy({left:Math.max(100,$('boardWrap').clientWidth*.72),behavior:'smooth'})};
$('navUp').onclick=()=>{$('boardWrap').scrollBy({top:-Math.max(90,$('boardWrap').clientHeight*.72),behavior:'smooth'})};
$('navDown').onclick=()=>{$('boardWrap').scrollBy({top:Math.max(90,$('boardWrap').clientHeight*.72),behavior:'smooth'})};
$('boardWrap').addEventListener('scroll',updateBoardControls,{passive:true});$('clear').onclick=clearSelected;
$('reset').onclick=()=>{if(confirm('清除本關答案並重玩？')){delete S.levels[L+1];sel='';W=0;save();render()}};
$('review').onclick=close;$('advance').onclick=goNext;
$('export').onclick=()=>{save();const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:3,state:S},null,2)],{type:'application/json'}));a.href=u;a.download='idiom-progress.json';a.click();URL.revokeObjectURL(u)};
$('import').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.state?.levels)throw Error('檔案格式不正確');S=d.state;for(const x of Object.values(S.levels)){if(!x.tileAssignment)x.tileAssignment={};if(!x.exhaustedTiles)x.exhaustedTiles=[]}L=0;render();say('進度已匯入。')}catch(x){alert('匯入失敗：'+x.message)}};r.readAsText(f)};
setInterval(()=>{if(!D)return;const s=state();if(!s.finished){s.seconds++;S.total++;$('timer').textContent=fmt(s.seconds);$('total').textContent=fmt(S.total);save()}},1000);
let lastLayoutWidth=window.innerWidth,resizeRenderTimer=null;
window.addEventListener('resize',()=>{
 const nextWidth=window.innerWidth;
 // Mobile Safari may resize its visual viewport while its browser bars expand/collapse.
 // A height-only change must not rebuild every crossword cell during a scroll gesture.
 if(Math.abs(nextWidth-lastLayoutWidth)<2)return;
 lastLayoutWidth=nextWidth;
 if(!D)return;
 clearTimeout(resizeRenderTimer);
 resizeRenderTimer=setTimeout(()=>{
  if(!activeDrag)render();
 },140);
});
fetch('data/levels.json').then(r=>{if(!r.ok)throw Error('棋盤資料尚未部署');return r.json()}).then(d=>{
 if(!d.levels||d.levels.length!==21)throw Error('棋盤資料格式錯誤');
 D=d;
 return fetch('data/strokes.json').then(r=>{if(!r.ok)throw Error('筆畫資料尚未部署');return r.json()}).then(map=>{STROKES=map}).catch(e=>{STROKES={};console.warn('Stroke-count data unavailable; candidates will use character-code order.',e)}).then(()=>{
  try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
  const initial=state(),initialClue=Object.keys(initial.revealed||{})[0];
  if(initialClue)pendingBoardFocus=initialClue;
  render();
  say(Object.keys(STROKES).length?'棋盤已載入。候選字按筆畫由少至多排列；拖曳時會自動吸附到附近的正確空格。':'棋盤已載入；筆畫資料暫不可用，候選字已用備用排序。');
 });
}).catch(e=>{$('title').textContent='棋盤資料尚未載入';say(e.message+'；請確認 GitHub Pages 已更新，並重新整理頁面。')});
})();

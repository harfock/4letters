<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3433"><title>成語圖譜・縱橫解字</title><style>
:root{color-scheme:dark;--bg:#0b3433;--p:#154744;--line:#326b62;--ink:#f7f1df;--mint:#b9e8cf;--gold:#f4d99c;--cell:40px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a514b,var(--bg) 62%);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}header,main{max-width:1200px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(1.2rem,3vw,2rem);margin:0}small,.muted,.foot{color:#b7d0c5}.panel,.stat{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:12px}.stats,.actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;margin-top:12px}button,input{font:inherit}button{cursor:pointer;background:#205750;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px}button.primary{background:var(--mint);color:var(--bg);font-weight:800}.boardwrap{overflow:auto;max-height:58vh;background:#0d3835;border-radius:12px;padding:12px}.board{display:grid;gap:3px;width:max-content;margin:auto}.cell{width:var(--cell);height:var(--cell);border:0;border-radius:6px;background:#e9e5d5;color:#183e39;padding:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;position:relative}.cell.block{background:#103c39;border:1px solid #1b4b45}.cell.filled{background:var(--mint)}.cell.revealed{background:var(--gold)}.cell.active{outline:3px solid var(--gold)}.num{position:absolute;top:1px;left:3px;font-size:9px;line-height:1;color:#54736b}.entry{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.entry input{width:150px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px}.wordlist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}.wordrow{display:flex;gap:8px;align-items:center;text-align:left;width:100%;padding:8px;background:var(--bg)}.wordrow.active{border-color:var(--gold)}.wordrow.done{color:var(--mint);text-decoration:line-through}.wordrow .n{color:var(--gold);min-width:20px}.wordrow .desc{flex:1}.levelgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.levelgrid button{padding:8px 0}.levelgrid .current{outline:2px solid var(--gold)}.levelgrid .done{background:var(--mint);color:var(--bg)}.toast{min-height:1.5em;color:var(--gold)}.candidate-panel{margin-top:12px;background:#103c39;border:1px solid var(--line);border-radius:13px;padding:12px}.candidate-heading{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:9px}.candidate-list{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:3px 2px}.candidate-tile{width:46px;height:48px;min-width:46px;padding:0;display:flex;align-items:center;justify-content:center;background:#e9e5d5;color:#183e39;border:2px solid #c5d9c7;border-radius:10px;font-size:23px;font-weight:850;box-shadow:0 2px 0 #0a302d;touch-action:none;user-select:none;-webkit-user-select:none}.candidate-tile:active{background:var(--mint)}.candidate-empty{color:var(--muted);font-size:.9rem;padding:8px 2px}.cell.drop-target{outline:4px solid var(--gold);outline-offset:2px;background:var(--mint);transform:scale(1.06);z-index:2}.cell.locked{box-shadow:inset 0 0 0 2px #a9d9bd}.drag-ghost{position:fixed;z-index:99999;width:66px;height:70px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:var(--mint);color:#0b3433;border:3px solid #f4d99c;font-size:36px;font-weight:900;box-shadow:0 10px 28px #0009;pointer-events:none;transform:translate(-50%,-50%) scale(1.12);transition:transform .06s linear;will-change:left,top}.foot{font-size:.82rem;line-height:1.6}.modalback{display:none;position:fixed;inset:0;background:#001a19cc;z-index:5;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{max-width:430px;width:100%;background:var(--p);border:1px solid #7aab96;border-radius:18px;padding:22px}@media(max-width:800px){:root{--cell:35px}header,main{padding:12px}.layout{grid-template-columns:1fr}.boardwrap{max-height:48vh}.wordlist{max-height:210px}}@media(max-width:390px){:root{--cell:30px}}
</style></head><body><header><div><h1>成語圖譜・縱橫解字</h1><small>逐字填寫 · 交叉解謎 · 逐關解鎖</small></div><div class="stats"><div class="stat">總用時 <b id="total">00:00</b></div><div class="stat">已完成 <b id="count">0</b> / 420</div></div></header><main>
<section class="panel"><b id="title">載入棋盤中…</b><div class="stats" style="margin-top:8px"><div class="stat">本關用時 <b id="timer">00:00</b></div><div class="stat">完成 <b id="doneCount">0</b></div></div></section>
<div class="layout"><section class="panel"><div class="boardwrap"><div id="board" class="board"></div></div><section class="candidate-panel"><div class="candidate-heading"><strong>候選字</strong><small id="candidateCount">載入候選字中…</small></div><div class="muted" style="font-size:.84rem;margin-bottom:9px">按住一個字，拖到上方空格。拖動時字會放大並移到手指上方，方便看清楚。</div><div id="candidates" class="candidate-list" aria-label="候選字"></div></section><div id="toast" class="toast" role="status"></div><div class="actions"><button id="hint" class="primary">提示一字</button><button id="check">檢查本詞</button><button id="clear">清除選格</button><button id="reset">重玩本關</button></div><p class="foot">把下方候選字拖到空格；如放錯，點選該格再按「清除選格」。答對成語後，會揭示相交成語的提示字。</p></section>
<aside><section class="panel"><h3 style="margin-top:0">本關成語</h3><div id="words" class="wordlist"></div></section><section class="panel" style="margin-top:12px"><h3 style="margin-top:0">選擇關卡</h3><div id="levels" class="levelgrid"></div><div class="actions" style="margin-top:10px"><button id="export">匯出進度</button><button id="import">匯入進度</button><input id="file" type="file" accept="application/json" hidden></div></section></aside></div>
<p class="foot">詞目以教育部《成語典》主條四字詞目為基礎；提示採遊戲內揭示字，不複製官方釋義。<a style="color:var(--mint)" href="https://language.moe.gov.tw/001/Upload/Files/site_content/M0001/respub/dict_idiomsdict_download.html" target="_blank" rel="noopener">官方資料下載頁</a></p></main>
<div id="modalback" class="modalback"><div class="modal"><h2 id="modalTitle">完成本關</h2><p id="modalBody"></p><div class="actions"><button id="review">留在本關</button><button id="advance" class="primary">下一關</button></div><small id="note"></small></div></div>
<script>
(()=>{'use strict';
const $=x=>document.getElementById(x),KEY='idiom-crossword-progress-v3';
let D,S,L=0,W=0,sel='',advanceTimer=null,activeDrag=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const fresh=()=>({levels:{},total:0});
function state(){
 const key=L+1;
 if(!S.levels[key]){
  const s=S.levels[key]={letters:{},revealed:{},completed:{},seconds:0,finished:false};
  if(D&&D.levels[L])D.levels[L].placements.forEach(p=>{
   if(p.initialReveal)cells(p).slice(0,p.initialReveal).forEach(c=>{s.revealed[c.r+','+c.c]=c.ch});
  });
 }
 return S.levels[key];
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cells(p){return [...p.word].map((ch,i)=>({r:p.row+(p.direction==='down'?i:0),c:p.col+(p.direction==='across'?i:0),ch}))}
function grid(){
 const ps=D.levels[L].placements,m=new Map();let minr=1e9,minc=1e9,maxr=-1e9,maxc=-1e9;
 ps.forEach((p,i)=>cells(p).forEach(x=>{
  minr=Math.min(minr,x.r);minc=Math.min(minc,x.c);maxr=Math.max(maxr,x.r);maxc=Math.max(maxc,x.c);
  const k=x.r+','+x.c;
  if(!m.has(k))m.set(k,{r:x.r,c:x.c,ch:x.ch,ids:[]});
  m.get(k).ids.push(i);
 }));
 return{ps,m,minr,minc,maxr,maxc};
}
function ensureTiles(s,g){
 if(!s.tileAssignment)s.tileAssignment={};
 if(!Array.isArray(s.exhaustedTiles))s.exhaustedTiles=[];
 if(!Array.isArray(s.tiles)){
  s.tiles=[];let n=0;
  for(const z of g.m.values()){
   const k=z.r+','+z.c;
   if(!s.revealed[k])s.tiles.push({id:'tile-'+n++,char:z.ch});
  }
  for(let i=s.tiles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s.tiles[i],s.tiles[j]]=[s.tiles[j],s.tiles[i]]}
 }
}
function val(x){const k=x.r+','+x.c,s=state();return s.letters[k]||s.revealed[k]||''}
function assignedIds(s){return new Set(Object.values(s.tileAssignment||{}))}
function exhaustedIds(s){return new Set(s.exhaustedTiles||[])}
function availableTiles(s){const used=assignedIds(s),spent=exhaustedIds(s);return s.tiles.filter(t=>!used.has(t.id)&&!spent.has(t.id))}
function isLocked(z,s){return !!z&&z.ids.some(i=>s.completed[i])}
function canDrop(k){
 const g=grid(),s=state(),z=g.m.get(k);return !!z&&!s.revealed[k]&&!isLocked(z,s);
}
function render(){
 const g=grid(),s=state(),b=$('board');ensureTiles(s,g);
 b.innerHTML='';b.style.gridTemplateColumns='repeat('+(g.maxc-g.minc+1)+',var(--cell))';
 const starts=new Map();g.ps.forEach((p,i)=>starts.set(p.row+','+p.col,i+1));
 for(let r=g.minr;r<=g.maxr;r++)for(let c=g.minc;c<=g.maxc;c++){
  const z=g.m.get(r+','+c),el=document.createElement('button');el.type='button';el.className='cell'+(z?'':' block');el.style.gridRow=r-g.minr+1;el.style.gridColumn=c-g.minc+1;
  if(z){
   const k=r+','+c,letter=s.letters[k]||s.revealed[k]||'';el.dataset.key=k;el.textContent=letter;
   if(s.letters[k])el.classList.add('filled');
   if(s.revealed[k])el.classList.add('revealed');
   if(z.ids.includes(W))el.classList.add('active');
   if(isLocked(z,s))el.classList.add('locked');
   if(starts.has(k)){const n=document.createElement('span');n.className='num';n.textContent=starts.get(k);el.textContent='';el.append(n,document.createTextNode(letter))}
   el.onclick=()=>{sel=k;if(!z.ids.includes(W))W=z.ids[0];say(isLocked(z,s)?'這格已屬於完成的成語。':'已選取格子；把候選字拖到空格。');render()};
  }
  b.append(el);
 }
 $('title').textContent='第 '+(L+1)+' 關 · '+g.ps.length+' 個成語';
 $('doneCount').textContent=Object.values(s.completed).filter(Boolean).length+' / '+g.ps.length;
 $('timer').textContent=fmt(s.seconds);
 $('words').innerHTML='';
 g.ps.forEach((p,i)=>{
  const el=document.createElement('button');el.className='wordrow'+(i===W?' active ':'')+(s.completed[i]?' done':'');
  el.innerHTML='<span class="n">'+(i+1)+'</span><span class="desc">'+(s.completed[i]?p.word:(p.direction==='across'?'橫向':'直向')+' · '+(cells(p).some(c=>s.revealed[c.r+','+c.c])?'有提示字':'待解鎖'))+'</span><span>'+(s.completed[i]?'✓':'›')+'</span>';
  el.onclick=()=>{W=i;const c=cells(p)[0];sel=c.r+','+c.c;render()};$('words').append(el);
 });
 $('levels').innerHTML='';
 D.levels.forEach((p,i)=>{const el=document.createElement('button');el.textContent=i+1;el.className=(i===L?'current ':'')+(S.levels[i+1]?.finished?'done':'');el.onclick=()=>switchLevel(i);$('levels').append(el)});
 renderCandidates(s);
 $('count').textContent=Object.values(S.levels).reduce((n,x)=>n+Object.values(x.completed||{}).filter(Boolean).length,0);
 $('total').textContent=fmt(S.total);save();
}
function renderCandidates(s){
 const box=$('candidates');box.innerHTML='';
 const free=availableTiles(s);
 $('candidateCount').textContent='剩餘 '+free.length+' 字';
 if(!free.length){const empty=document.createElement('div');empty.className='candidate-empty';empty.textContent='目前沒有剩餘候選字。若放錯，可清除格子後再試。';box.append(empty);return}
 free.forEach(tile=>{
  const el=document.createElement('button');el.type='button';el.className='candidate-tile';el.textContent=tile.char;el.setAttribute('aria-label','拖曳候選字 '+tile.char+' 到棋盤格');el.dataset.tileId=tile.id;
  el.addEventListener('pointerdown',e=>beginDrag(e,tile));box.append(el);
 });
}
function switchLevel(i){cancelActiveDrag();close();L=Math.max(0,Math.min(20,i));W=0;sel='';render()}
function say(t){$('toast').textContent=t}
function beginDrag(e,tile){
 if(e.pointerType==='mouse'&&e.button!==0)return;
 const s=state(),g=grid();ensureTiles(s,g);
 if(!availableTiles(s).some(t=>t.id===tile.id))return;
 e.preventDefault();cancelActiveDrag(false);
 const ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=tile.char;ghost.setAttribute('aria-hidden','true');document.body.append(ghost);
 activeDrag={tile,tileId:tile.id,pointerId:e.pointerId,ghost,targetKey:null};
 moveDrag(e);
 document.addEventListener('pointermove',moveDrag,{passive:false});
 document.addEventListener('pointerup',endDrag);
 document.addEventListener('pointercancel',cancelActiveDrag);
}
function moveDrag(e){
 if(!activeDrag||e.pointerId!==activeDrag.pointerId)return;
 e.preventDefault();
 activeDrag.ghost.style.left=e.clientX+'px';
 activeDrag.ghost.style.top=Math.max(42,e.clientY-72)+'px';
 document.querySelectorAll('.cell.drop-target').forEach(el=>el.classList.remove('drop-target'));
 const hit=document.elementFromPoint(e.clientX,e.clientY);
 const target=hit&&hit.closest?hit.closest('.cell[data-key]'):null;
 if(target&&canDrop(target.dataset.key)){target.classList.add('drop-target');activeDrag.targetKey=target.dataset.key}
 else activeDrag.targetKey=null;
}
function cleanupDrag(){
 document.removeEventListener('pointermove',moveDrag);
 document.removeEventListener('pointerup',endDrag);
 document.removeEventListener('pointercancel',cancelActiveDrag);
 document.querySelectorAll('.cell.drop-target').forEach(el=>el.classList.remove('drop-target'));
 if(activeDrag&&activeDrag.ghost)activeDrag.ghost.remove();
 activeDrag=null;
}
function cancelActiveDrag(showMessage=true){
 const wasDragging=!!activeDrag;cleanupDrag();
 if(showMessage&&wasDragging)say('已取消拖曳。');
}
function endDrag(e){
 if(!activeDrag||e.pointerId!==activeDrag.pointerId)return;
 moveDrag(e);
 const tile=activeDrag.tile,k=activeDrag.targetKey;
 cleanupDrag();
 if(k)dropTile(tile,k);
}
function dropTile(tile,k){
 const s=state(),g=grid();ensureTiles(s,g);
 if(!canDrop(k)){say('請把候選字放到未完成成語的空格。');return}
 if(!availableTiles(s).some(t=>t.id===tile.id)){say('這個候選字已被使用。');return}
 const previous=s.tileAssignment[k];
 if(previous){delete s.tileAssignment[k];delete s.letters[k]}
 s.tileAssignment[k]=tile.id;s.letters[k]=tile.char;sel=k;
 if(tile.char===g.m.get(k).ch)say('已放入「'+tile.char+'」。');
 else say('已放入「'+tile.char+'」；若不合適，可選格後按「清除選格」。');
 checkAll();render();
}
function releaseTileAt(s,k){if(s.tileAssignment[k])delete s.tileAssignment[k];delete s.letters[k]}
function revealCell(s,g,k,ch){
 if(s.revealed[k])return;
 const current=s.letters[k];
 const oldTileId=s.tileAssignment[k];
 const oldTile=oldTileId?s.tiles.find(t=>t.id===oldTileId):null;
 if(oldTileId){delete s.tileAssignment[k];delete s.letters[k]}
 if(current===ch){
  if(oldTile&&oldTile.char===ch&&!s.exhaustedTiles.includes(oldTile.id))s.exhaustedTiles.push(oldTile.id);
  s.revealed[k]=ch;
  return;
 }
 delete s.letters[k];
 const used=assignedIds(s),spent=exhaustedIds(s);
 let clueTile=oldTile&&oldTile.char===ch?oldTile:s.tiles.find(t=>t.char===ch&&!used.has(t.id)&&!spent.has(t.id));
 if(!clueTile){
  for(const [otherKey,tileId] of Object.entries(s.tileAssignment)){
   const tile=s.tiles.find(t=>t.id===tileId),z=g.m.get(otherKey);
   if(tile&&tile.char===ch&&z&&z.ch!==ch&&!isLocked(z,s)){
    delete s.tileAssignment[otherKey];delete s.letters[otherKey];clueTile=tile;break;
   }
  }
 }
 if(clueTile&&!s.exhaustedTiles.includes(clueTile.id))s.exhaustedTiles.push(clueTile.id);
 s.revealed[k]=ch;
}
function checkAll(){
 const s=state(),g=grid();
 g.ps.forEach((p,i)=>{
  if(s.completed[i])return;
  const cs=cells(p);
  if(cs.map(val).join('')===p.word){
   s.completed[i]=true;
   cs.forEach((x,j)=>{s.letters[x.r+','+x.c]=p.word[j]});
   cs.forEach(x=>{
    const z=g.m.get(x.r+','+x.c);
    z.ids.forEach(j=>{
     if(j!==i&&!s.completed[j]&&!g.ps[j].initialReveal){
      const clue=cells(g.ps[j])[0],k=clue.r+','+clue.c;
      revealCell(s,g,k,clue.ch);
     }
    });
   });
   say('答對：'+p.word+'！已解鎖相交成語的提示字。');
  }
 });
 if(Object.values(s.completed).filter(Boolean).length===g.ps.length&&!s.finished){s.finished=true;complete()}
}
function hint(){
 const s=state(),g=grid(),p=g.ps[W];ensureTiles(s,g);
 if(s.completed[W]){say('這個成語已完成。');return}
 const target=cells(p).find(c=>val(c)!==c.ch)||cells(p).find(c=>!val(c));
 if(!target){say('這個成語沒有可揭示的字。');return}
 revealCell(s,g,target.r+','+target.c,target.ch);sel=target.r+','+target.c;say('已揭示一字。');checkAll();render();
}
function checkOne(){const p=grid().ps[W];if(cells(p).map(val).join('')===p.word){checkAll();say(state().completed[W]?'正確！':'字詞已符合，請再檢查交叉格。')}else say('本詞尚未正確，請調整候選字。');render()}
function clearSelected(){
 if(!sel){say('請先點選一個格子。');return}
 const s=state(),g=grid(),z=g.m.get(sel);
 if(!z){say('這不是可填寫的格子。');return}
 if(s.revealed[sel]){say('提示字不能清除。');return}
 if(isLocked(z,s)){say('已完成成語的字不能清除。');return}
 releaseTileAt(s,sel);say('已清除該格，候選字已放回清單。');render();
}
function complete(){
 $('modalTitle').textContent=L===20?'恭喜完成全部 21 關！':'第 '+(L+1)+' 關完成！';
 $('modalBody').textContent='本關用時 '+fmt(state().seconds)+'。累計完成 '+Object.values(S.levels).reduce((n,x)=>n+Object.values(x.completed||{}).filter(Boolean).length,0)+' 個成語。';
 $('advance').textContent=L===20?'重玩第 1 關':'下一關';$('modalback').classList.add('show');
 let n=3;advanceTimer=setInterval(()=>{n--;if(n<=0)goNext();else $('note').textContent=n+' 秒後自動前往下一關'},1000);
}
function close(){if(advanceTimer)clearInterval(advanceTimer);advanceTimer=null;$('modalback').classList.remove('show')}
function goNext(){close();switchLevel(L===20?0:L+1)}
$('hint').onclick=hint;$('check').onclick=checkOne;$('clear').onclick=clearSelected;
$('reset').onclick=()=>{if(confirm('清除本關答案並重玩？')){S.levels[L+1]={letters:{},revealed:{},completed:{},seconds:0,finished:false};sel='';render()}};
$('review').onclick=close;$('advance').onclick=goNext;
$('export').onclick=()=>{save();const a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:3,state:S},null,2)],{type:'application/json'}));a.href=u;a.download='idiom-progress.json';a.click();URL.revokeObjectURL(u)};
$('import').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.state?.levels)throw Error('檔案格式不正確');S=d.state;for(const x of Object.values(S.levels)){if(!x.tileAssignment)x.tileAssignment={};if(!x.exhaustedTiles)x.exhaustedTiles=[]}L=0;render();say('進度已匯入。')}catch(x){alert('匯入失敗：'+x.message)}};r.readAsText(f)};
setInterval(()=>{if(!D)return;const s=state();if(!s.finished){s.seconds++;S.total++;$('timer').textContent=fmt(s.seconds);$('total').textContent=fmt(S.total);save()}},1000);
fetch('data/levels.json').then(r=>{if(!r.ok)throw Error('棋盤資料尚未部署');return r.json()}).then(d=>{if(!d.levels||d.levels.length!==21)throw Error('棋盤資料格式錯誤');D=d;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}render();say('棋盤已載入。拖曳下方候選字到格子即可開始。')}).catch(e=>{$('title').textContent='棋盤資料尚未載入';say(e.message+'；請確認 GitHub Pages 已更新，並重新整理頁面。')});
})();
</script></body></html>

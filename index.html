<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b3433"><title>成語圖譜・縱橫解字</title><style>
:root{color-scheme:dark;--bg:#0b3433;--p:#154744;--line:#326b62;--ink:#f7f1df;--mint:#b9e8cf;--gold:#f4d99c;--cell:40px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a514b,var(--bg) 62%);color:var(--ink);font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif}header,main{max-width:1200px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(1.2rem,3vw,2rem);margin:0}small,.muted,.foot{color:#b7d0c5}.panel,.stat{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:12px}.stats,.actions{display:flex;gap:8px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:12px;margin-top:12px}button,input{font:inherit}button{cursor:pointer;background:#205750;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px}button.primary{background:var(--mint);color:var(--bg);font-weight:800}.boardwrap{overflow:auto;max-height:58vh;background:#0d3835;border-radius:12px;padding:12px}.board{display:grid;gap:3px;width:max-content;margin:auto}.cell{width:var(--cell);height:var(--cell);border:0;border-radius:6px;background:#e9e5d5;color:#183e39;padding:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;position:relative}.cell.block{background:#103c39;border:1px solid #1b4b45}.cell.filled{background:var(--mint)}.cell.revealed{background:var(--gold)}.cell.active{outline:3px solid var(--gold)}.num{position:absolute;top:1px;left:3px;font-size:9px;line-height:1;color:#54736b}.entry{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.entry input{width:150px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px}.wordlist{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow:auto}.wordrow{display:flex;gap:8px;align-items:center;text-align:left;width:100%;padding:8px;background:var(--bg)}.wordrow.active{border-color:var(--gold)}.wordrow.done{color:var(--mint);text-decoration:line-through}.wordrow .n{color:var(--gold);min-width:20px}.wordrow .desc{flex:1}.levelgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.levelgrid button{padding:8px 0}.levelgrid .current{outline:2px solid var(--gold)}.levelgrid .done{background:var(--mint);color:var(--bg)}.toast{min-height:1.5em;color:var(--gold)}.foot{font-size:.82rem;line-height:1.6}.modalback{display:none;position:fixed;inset:0;background:#001a19cc;z-index:5;align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}.modal{max-width:430px;width:100%;background:var(--p);border:1px solid #7aab96;border-radius:18px;padding:22px}@media(max-width:800px){:root{--cell:35px}header,main{padding:12px}.layout{grid-template-columns:1fr}.boardwrap{max-height:48vh}.wordlist{max-height:210px}}@media(max-width:390px){:root{--cell:30px}}
</style></head><body><header><div><h1>成語圖譜・縱橫解字</h1><small>逐字填寫 · 交叉解謎 · 逐關解鎖</small></div><div class="stats"><div class="stat">總用時 <b id="total">00:00</b></div><div class="stat">已完成 <b id="count">0</b> / 420</div></div></header><main>
<section class="panel"><b id="title">載入棋盤中…</b><div class="stats" style="margin-top:8px"><div class="stat">本關用時 <b id="timer">00:00</b></div><div class="stat">完成 <b id="doneCount">0</b></div></div></section>
<div class="layout"><section class="panel"><div class="boardwrap"><div id="board" class="board"></div></div><div class="entry"><label for="char">輸入中文字</label><input id="char" autocomplete="off" placeholder="先點選格子"><button id="put" class="primary">填入</button></div><div id="toast" class="toast" role="status"></div><div class="actions"><button id="hint" class="primary">提示一字</button><button id="check">檢查本詞</button><button id="clear">清除選格</button><button id="reset">重玩本關</button></div><p class="foot">點選格子後，使用輸入框輸入中文字（支援中文輸入法）。答對成語後，會揭示相交成語的一字。</p></section>
<aside><section class="panel"><h3 style="margin-top:0">本關成語</h3><div id="words" class="wordlist"></div></section><section class="panel" style="margin-top:12px"><h3 style="margin-top:0">選擇關卡</h3><div id="levels" class="levelgrid"></div><div class="actions" style="margin-top:10px"><button id="export">匯出進度</button><button id="import">匯入進度</button><input id="file" type="file" accept="application/json" hidden></div></section></aside></div>
<p class="foot">詞目以教育部《成語典》主條四字詞目為基礎；提示採遊戲內揭示字，不複製官方釋義。<a style="color:var(--mint)" href="https://language.moe.gov.tw/001/Upload/Files/site_content/M0001/respub/dict_idiomsdict_download.html" target="_blank" rel="noopener">官方資料下載頁</a></p></main>
<div id="modalback" class="modalback"><div class="modal"><h2 id="modalTitle">完成本關</h2><p id="modalBody"></p><div class="actions"><button id="review">留在本關</button><button id="advance" class="primary">下一關</button></div><small id="note"></small></div></div>
<script>
(()=>{'use strict';const $=x=>document.getElementById(x),KEY='idiom-crossword-progress-v1';let D,S,L=0,W=0,sel='',advanceTimer=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),fresh=()=>({levels:{},total:0});
function state(){let key=L+1;if(!S.levels[key]){let s=S.levels[key]={letters:{},revealed:{},completed:{},seconds:0,finished:false};if(D&&D.levels[L])D.levels[L].placements.forEach(p=>{if(p.initialReveal){cells(p).slice(0,p.initialReveal).forEach(c=>{s.revealed[c.r+','+c.c]=c.ch})}})}return S.levels[key]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cells(p){return [...p.word].map((ch,i)=>({r:p.row+(p.direction==='down'?i:0),c:p.col+(p.direction==='across'?i:0),ch}))}
function grid(){let ps=D.levels[L].placements,m=new Map(),minr=1e9,minc=1e9,maxr=-1e9,maxc=-1e9;ps.forEach((p,i)=>cells(p).forEach(x=>{minr=Math.min(minr,x.r);minc=Math.min(minc,x.c);maxr=Math.max(maxr,x.r);maxc=Math.max(maxc,x.c);let k=x.r+','+x.c;if(!m.has(k))m.set(k,{r:x.r,c:x.c,ids:[]});m.get(k).ids.push(i)}));return{ps,m,minr,minc,maxr,maxc}}
function val(x){let k=x.r+','+x.c,s=state();return s.letters[k]||s.revealed[k]||''}
function render(){let g=grid(),s=state(),b=$('board');b.innerHTML='';b.style.gridTemplateColumns='repeat('+(g.maxc-g.minc+1)+',var(--cell))';let starts=new Map();g.ps.forEach((p,i)=>starts.set(p.row+','+p.col,i+1));
for(let r=g.minr;r<=g.maxr;r++)for(let c=g.minc;c<=g.maxc;c++){let z=g.m.get(r+','+c),el=document.createElement('button');el.className='cell'+(z?'':' block');el.style.gridRow=r-g.minr+1;el.style.gridColumn=c-g.minc+1;if(z){let k=r+','+c;el.textContent=s.letters[k]||s.revealed[k]||'';if(s.letters[k])el.classList.add('filled');if(s.revealed[k])el.classList.add('revealed');if(z.ids.includes(W))el.classList.add('active');if(starts.has(k)){let n=document.createElement('span');n.className='num';n.textContent=starts.get(k);el.textContent='';el.append(n,document.createTextNode(s.letters[k]||s.revealed[k]||''))}el.onclick=()=>{sel=k;if(!z.ids.includes(W))W=z.ids[0];render();$('char').focus()}}b.append(el)}
$('title').textContent='第 '+(L+1)+' 關 · '+g.ps.length+' 個成語';$('doneCount').textContent=Object.values(s.completed).filter(Boolean).length+' / '+g.ps.length;$('timer').textContent=fmt(s.seconds);
$('words').innerHTML='';g.ps.forEach((p,i)=>{let el=document.createElement('button');el.className='wordrow'+(i===W?' active ':'')+(s.completed[i]?' done':'');el.innerHTML='<span class="n">'+(i+1)+'</span><span class="desc">'+(s.completed[i]?p.word:(p.direction==='across'?'橫向':'直向')+' · '+(p.initialReveal?'有提示字':'待解鎖'))+'</span><span>'+(s.completed[i]?'✓':'›')+'</span>';el.onclick=()=>{W=i;let c=cells(p)[0];sel=c.r+','+c.c;render()};$('words').append(el)});
$('levels').innerHTML='';D.levels.forEach((p,i)=>{let el=document.createElement('button');el.textContent=i+1;el.className=(i===L?'current ':'')+(S.levels[i+1]?.finished?'done':'');el.onclick=()=>switchLevel(i);$('levels').append(el)});
$('count').textContent=Object.values(S.levels).reduce((n,x)=>n+Object.values(x.completed||{}).filter(Boolean).length,0);$('total').textContent=fmt(S.total);save()}
function switchLevel(i){close();L=Math.max(0,Math.min(20,i));W=0;sel='';render()}
function say(t){$('toast').textContent=t}
function put(){let chars=[...$('char').value.trim()];if(!chars.length)return;let g=grid();if(!sel){let c=cells(g.ps[W])[0];sel=c.r+','+c.c}for(let ch of chars){let k=sel;if(state().revealed[k])continue;state().letters[k]=ch;let p=g.ps[W],cs=cells(p),i=cs.findIndex(x=>x.r+','+x.c===k);if(i>=0&&i<cs.length-1)sel=cs[i+1].r+','+cs[i+1].c} $('char').value='';checkAll();render();$('char').focus()}
function checkAll(){
let s=state(),g=grid();
g.ps.forEach((p,i)=>{
 if(s.completed[i])return;
 let cs=cells(p);
 if(cs.map(val).join('')===p.word){
  s.completed[i]=true;
  cs.forEach((x,j)=>{s.letters[x.r+','+x.c]=p.word[j]});
  cs.forEach(x=>{
   g.m.get(x.r+','+x.c).ids.forEach(j=>{
    if(j!==i&&!s.completed[j]&&!g.ps[j].initialReveal){
     let c=cells(g.ps[j])[0];s.revealed[c.r+','+c.c]=c.ch;
    }
   });
  });
  say('答對：'+p.word+'！已揭示相交成語的提示字。');
 }
});
if(Object.values(s.completed).filter(Boolean).length===g.ps.length&&!s.finished){s.finished=true;complete()}
}
function hint(){let p=grid().ps[W],c=cells(p).find(x=>!val(x))||cells(p)[0];state().revealed[c.r+','+c.c]=c.ch;sel=c.r+','+c.c;say('已揭示一字。');checkAll();render()}
function checkOne(){let p=grid().ps[W];if(cells(p).map(val).join('')===p.word){state().completed[W]=true;checkAll();say('正確！')}else say('本詞尚未正確。');render()}
function complete(){ $('modalTitle').textContent=L===20?'恭喜完成全部 21 關！':'第 '+(L+1)+' 關完成！';$('modalBody').textContent='本關用時 '+fmt(state().seconds)+'。累計完成 '+$('count').textContent+' 個成語。';$('advance').textContent=L===20?'重玩第 1 關':'下一關';$('modalback').classList.add('show');let n=3;advanceTimer=setInterval(()=>{n--;if(n<=0)goNext();else $('note').textContent=n+' 秒後自動前往下一關'},1000)}
function close(){if(advanceTimer)clearInterval(advanceTimer);advanceTimer=null;$('modalback').classList.remove('show')}
function goNext(){close();switchLevel(L===20?0:L+1)}
$('put').onclick=put;$('char').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();put()}};$('hint').onclick=hint;$('check').onclick=checkOne;$('clear').onclick=()=>{if(sel&&!state().revealed[sel])delete state().letters[sel];render()};$('reset').onclick=()=>{if(confirm('清除本關答案並重玩？')){S.levels[L+1]={letters:{},revealed:{},completed:{},seconds:0,finished:false};render()}};$('review').onclick=close;$('advance').onclick=goNext;
$('export').onclick=()=>{save();let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({version:1,state:S},null,2)],{type:'application/json'}));a.href=u;a.download='idiom-progress.json';a.click();URL.revokeObjectURL(u)};$('import').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.state?.levels)throw Error('格式不正確');S=d.state;render();say('進度已匯入。')}catch(x){alert('匯入失敗：'+x.message)}};r.readAsText(f)};
setInterval(()=>{if(!D)return;let s=state();if(!s.finished){s.seconds++;S.total++;$('timer').textContent=fmt(s.seconds);$('total').textContent=fmt(S.total);save()}},1000);
fetch('data/levels.json').then(r=>{if(!r.ok)throw Error('棋盤資料尚未部署');return r.json()}).then(d=>{if(!d.levels||d.levels.length!==21)throw Error('棋盤資料格式錯誤');D=d;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}render();say('棋盤已載入，選格後輸入中文字開始。')}).catch(e=>{$('title').textContent='棋盤資料尚未載入';say(e.message+'；部署建置流程會自動產生棋盤。')});
})();
</script></body></html>

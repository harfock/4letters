<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06152a"/><stop offset=".48" stop-color="#10274c"/><stop offset="1" stop-color="#071327"/></linearGradient>
 <radialGradient id="core" cx="50%" cy="47%" r="66%"><stop stop-color="#153866" stop-opacity=".34"/><stop offset=".62" stop-color="#071327" stop-opacity=".12"/><stop offset="1" stop-color="#040b17" stop-opacity=".62"/></radialGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e5ff"/><stop offset="1" stop-color="#1768ff"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5b71"/><stop offset="1" stop-color="#bd183d"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a1"/><stop offset="1" stop-color="#ffb721"/></linearGradient>
 <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1dbaff" stop-opacity=".65"/><stop offset="1" stop-color="#1dbaff" stop-opacity="0"/></linearGradient>
 <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#43bcff" fill-opacity=".65"/></pattern>
 <pattern id="dotsRed" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.1" fill="#ff526e" fill-opacity=".7"/></pattern>
 <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
<rect width="1280" height="720" fill="url(#core)"/>
